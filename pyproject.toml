[project]
name = "bpps"
version = "0.1.0"
description = "A prediction system for the performance of a player in basketball."
readme = "README.md"
authors = [
    { name = "segfaultering", email = "261435586+segfaultering@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
bpps = "bpps:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
