name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - run: uv sync --frozen --group research
      - run: uv run pyrefly check
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PORTFOLIO_DEMO: "1"
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://unavailable.example
      - run: npx playwright test --config portfolio.playwright.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t courtside-api .
      - run: |
          docker run -d --name courtside-api --memory=1g --memory-swap=1g --cpus=2 -p 8000:8000 courtside-api
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs courtside-api
          exit 1
      - run: docker stop courtside-api
      - run: docker build -f Dockerfile.verify -t courtside-verify .
      - run: docker run --rm --memory=2g --memory-swap=2g --cpus=2 --shm-size=256m courtside-verify
